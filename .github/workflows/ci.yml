name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-guards:
    name: Source Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Python syntax
        run: python3 -m compileall -q scripts

      - name: Package and release guards
        run: |
          scripts/check-package-config.sh
          python3 scripts/check-first-contact-public-dialect.py
          python3 scripts/check-planning-state.py
          python3 scripts/check-release-docs.py
          python3 scripts/check-release-skus.py
          python3 scripts/check-component-map.py
          python3 scripts/check-api-surface-map.py
          python3 scripts/check-package-docs.py
          python3 scripts/check-release-notes.py

      - name: CMake preset shape
        run: |
          cmake --list-presets
          python3 scripts/check-cmake-preset-build-dir.py .

  container-compile:
    name: Container Compile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: conflux_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conflux_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build CI toolchain image
        run: docker build -f .github/docker/ci-toolchain.Dockerfile -t conflux-ci-toolchain .

      - name: Prepare PostgreSQL roles
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            postgres:16 \
            psql -h host.docker.internal -U postgres -d conflux_test -v ON_ERROR_STOP=1 \
              -c 'DO $$ BEGIN CREATE ROLE root LOGIN SUPERUSER; EXCEPTION WHEN duplicate_object THEN NULL; END $$;'

      - name: Compile and test supported surfaces
        run: |
          docker_runtime_args=(--rm)
          pg_host=127.0.0.1

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            docker_runtime_args+=(--add-host=host.docker.internal:host-gateway)
            pg_host=host.docker.internal
          else
            docker_runtime_args+=(
              --privileged
              --network host
              --security-opt seccomp=unconfined
              --security-opt apparmor=unconfined
              --ulimit memlock=-1:-1
            )
          fi

          docker run "${docker_runtime_args[@]}" \
            -v "$PWD:/work" \
            -w /work \
            -e "PG_HOST=${pg_host}" \
            conflux-ci-toolchain \
            bash -lc '
              set -euo pipefail
              export PG_TEST_CONNINFO="host=${PG_HOST} port=5432 dbname=conflux_test user=postgres"
              export PG_CONNINFO="$PG_TEST_CONNINFO"
              visible_cpus="$(nproc)"
              echo "visible CPUs: ${visible_cpus}"
              if [[ -r /sys/fs/cgroup/cpu.max ]]; then
                echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max)"
              fi
              if (( visible_cpus < 2 )); then
                echo "CI container needs at least 2 visible CPUs for concurrency tests" >&2
                exit 1
              fi
              cmake --version
              ninja --version
              python3 --version
              clang++ --version
              clang-scan-deps --version
              g++-16 --version
              pkg-config --modversion \
                liburing \
                openssl \
                libnghttp2 \
                libpq \
                libdeflate \
                libzstd \
                libxxhash \
                libbrotlienc \
                libbrotlidec

              cleanup_preset() {
                local preset="$1"
                local dir
                dir="$(python3 scripts/cmake-preset-build-dir.py "$PWD" "$preset")"
                rm -rf "$dir"
              }

              run_preset_ctest() {
                local preset="$1"
                local dir
                dir="$(python3 scripts/cmake-preset-build-dir.py "$PWD" "$preset")"
                scripts/run-ctest.sh --test-dir "$dir" --output-on-failure
              }

              export CXX=g++-16
              cmake --preset full
              cmake --build --preset full
              cleanup_preset full

              cmake --preset debug-clang-libcxx
              cmake --build --preset debug-clang-libcxx
              run_preset_ctest debug-clang-libcxx
              cleanup_preset debug-clang-libcxx

              cmake --preset debug-gcc16-stdcxx
              cmake --build --preset debug-gcc16-stdcxx
              run_preset_ctest debug-gcc16-stdcxx
              cleanup_preset debug-gcc16-stdcxx
            '
