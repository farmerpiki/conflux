name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-guards:
    name: Source Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install guard tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Python syntax
        run: python3 -m compileall -q scripts

      - name: Package and release guards
        run: |
          scripts/check-package-config.sh
          python3 scripts/check-first-contact-public-dialect.py
          python3 scripts/check-planning-state.py
          python3 scripts/check-release-docs.py
          python3 scripts/check-release-skus.py
          python3 scripts/check-component-map.py
          python3 scripts/check-api-surface-map.py
          python3 scripts/check-package-docs.py
          python3 scripts/check-release-notes.py

      - name: CMake preset shape
        run: |
          cmake --list-presets
          python3 scripts/check-cmake-preset-build-dir.py .

  container-compile:
    name: Container Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI toolchain image
        run: docker build -f .github/docker/ci-toolchain.Dockerfile -t conflux-ci-toolchain .

      - name: Compile supported surfaces
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            conflux-ci-toolchain \
            bash -lc '
              set -euo pipefail
              cmake --version
              ninja --version
              python3 --version
              clang++ --version
              clang-scan-deps --version
              g++-16 --version
              pkg-config --modversion \
                liburing \
                openssl \
                libnghttp2 \
                libpq \
                libdeflate \
                libzstd \
                libxxhash \
                libbrotlienc \
                libbrotlidec

              cleanup_preset() {
                local preset="$1"
                local dir
                dir="$(python3 scripts/cmake-preset-build-dir.py "$PWD" "$preset")"
                rm -rf "$dir"
              }

              export CXX=g++-16
              cmake --preset full
              cmake --build --preset full
              cleanup_preset full

              cmake --preset debug-clang-libcxx
              cmake --build --preset debug-clang-libcxx
              cleanup_preset debug-clang-libcxx

              cmake --preset debug-gcc16-stdcxx
              cmake --build --preset debug-gcc16-stdcxx
              cleanup_preset debug-gcc16-stdcxx
            '
