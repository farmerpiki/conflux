# conflux default configuration

[server]
port         = 9090
rings        = 0     # 0 = std::thread::hardware_concurrency()
ring_entries = 1024  # SQ/CQ depth per ring

[io_uring]
single_issuer = true   # IORING_SETUP_SINGLE_ISSUER  — ring tied to one thread
defer_taskrun = true   # IORING_SETUP_DEFER_TASKRUN  — batch task work in userspace
sqpoll        = false  # IORING_SETUP_SQPOLL         — kernel polls SQ (may need CAP_SYS_NICE)
coop_taskrun  = true   # IORING_SETUP_COOP_TASKRUN   — defer until io_uring_enter
taskrun_flag  = true   # IORING_SETUP_TASKRUN_FLAG
submit_all    = false  # IORING_SETUP_SUBMIT_ALL     — don't stop on first SQE error

[static_cache]
enabled              = false    # cache small static files in process memory
small_file_max_bytes = 65536    # files at or below this size are cache candidates
max_total_bytes      = 16777216 # total cache budget before LRU eviction
