# conflux default configuration

[server]
port         = 9090
rings        = 0     # 0 = std::thread::hardware_concurrency()
ring_entries = 1024  # SQ/CQ depth per ring

# Hardened HTTP parser/body defaults. Raise deliberately per deployment.
max_body_size          = 1048576  # 1 MiB request body cap
request_timeout_ms     = 30000    # idle/incomplete request timeout; 0 disables
tls_sniff_timeout_ms   = 10000    # first-byte TLS/plain sniff timeout; 0 disables
max_request_line_size  = 8192     # request line cap before 414
max_header_line_size   = 8192     # single header line cap before 431
max_headers            = 100      # header count cap before 431
max_header_block_size  = 65536    # aggregate header bytes cap before 431
max_chunks             = 100000   # chunked body chunk-count cap before 400

[io_uring]
single_issuer = true   # IORING_SETUP_SINGLE_ISSUER  — ring tied to one thread
defer_taskrun = true   # IORING_SETUP_DEFER_TASKRUN  — batch task work in userspace
sqpoll        = false  # IORING_SETUP_SQPOLL         — kernel polls SQ (may need CAP_SYS_NICE)
coop_taskrun  = true   # IORING_SETUP_COOP_TASKRUN   — defer until io_uring_enter
taskrun_flag  = true   # IORING_SETUP_TASKRUN_FLAG
submit_all    = false  # IORING_SETUP_SUBMIT_ALL     — don't stop on first SQE error

[static_cache]
enabled              = false    # cache small static files in process memory
small_file_max_bytes = 65536    # files at or below this size are cache candidates
max_total_bytes      = 16777216 # total cache budget before LRU eviction

[auth]
# Secret sources are intentionally unset by default. Production auth helpers fail
# closed until each required secret is supplied via *_secret_env or *_secret_file.
# Literal *_secret values are useful for local tests only; prefer env/file/secret-manager injection.
# password_verifier_secret_env = CONFLUX_AUTH_PASSWORD_PEPPER
password_verifier_min_secret_bytes = 16
# jwt_secret_env = CONFLUX_AUTH_JWT_SECRET
# jwt_previous_secret_env = CONFLUX_AUTH_JWT_PREVIOUS_SECRET
jwt_min_secret_bytes = 16
# cookie_secret_env = CONFLUX_AUTH_COOKIE_SECRET
# cookie_previous_secret_env = CONFLUX_AUTH_COOKIE_PREVIOUS_SECRET
cookie_min_secret_bytes = 16
# session_secret_env = CONFLUX_AUTH_SESSION_SECRET
# session_previous_secret_env = CONFLUX_AUTH_SESSION_PREVIOUS_SECRET
session_min_secret_bytes = 16
